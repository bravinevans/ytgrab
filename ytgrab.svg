<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2024"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#C21313"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Outer capture wave -->
  <path d="M 180,140 C 180,180 145,215 145,270 C 145,340 200,390 256,415 C 312,390 367,340 367,270 C 367,215 332,180 332,140" 
        fill="none" stroke="url(#redGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  
  <!-- Inner capture wave / claw -->
  <path d="M 200,165 C 200,195 165,225 165,270 C 165,325 210,365 256,388 C 302,365 347,325 347,270 C 347,225 312,195 312,165" 
        fill="none" stroke="url(#redGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Main Downward Grab Arrow -->
  <path d="M 224,120 L 288,120 L 288,255 L 340,255 L 256,355 L 172,255 L 224,255 Z" 
        fill="url(#redGrad)" filter="url(#shadow)"/>
        
  <!-- Play Button cutout / emblem -->
  <polygon points="244,235 244,285 284,260" fill="#121316" opacity="0.85"/>
</svg>
